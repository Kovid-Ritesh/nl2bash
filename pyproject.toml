[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2sh-agent"
version = "0.1.0"
description = "A guarded terminal agent for an NL2SH inference endpoint"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nl2bash = "nl2sh.cli:main"
nl2sh = "nl2sh.cli:main"

[tool.setuptools.packages.find]
include = ["nl2sh*"]
